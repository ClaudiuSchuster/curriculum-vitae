name: CV

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install document tools and fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-core librsvg2-bin poppler-utils ripgrep

      - name: Build and verify public CV package
        env:
          CV_OUTPUT_DIR: ${{ runner.temp }}/cv-build
        run: make public-check

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v7.0.1

      - name: Initialise CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: actions,javascript-typescript
          queries: security-extended

      - name: Analyse repository
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - check
      - codeql
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out verified tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v7.0.1

      - name: Publish versioned CV assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cv_release_label=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" \
            dist/Claudiu_Schuster_CV_DE.pdf \
            dist/Claudiu_Schuster_CV_EN.pdf \
            dist/SHA256SUMS \
            --verify-tag \
            --latest \
            --title "$cv_release_label · CV" \
            --notes "Verified German and English curriculum vitae from commit ${GITHUB_SHA}."
