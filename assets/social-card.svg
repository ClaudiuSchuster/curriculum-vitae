<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Claudiu Schuster — Senior Cloud and Platform Engineer</title>
  <desc id="description">Repository card for a bilingual German and English curriculum vitae.</desc>

  <defs>
